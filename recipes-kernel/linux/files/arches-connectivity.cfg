# Kernel support for WebConfig features not guaranteed on by the stock Tegra
# defconfig: WireGuard (Security page), USB CDC-ACM for the STM32 companion
# MCU (board-manifests/arches.json "mcu-stm32" → /dev/ttyACM0), PPS for the
# optional GPS PPS discipline input, and CAN-FD (board manifest declares
# fd=true on can0). `=m` where the upstream default is already `=m`/unset, to
# avoid forcing a build-in that fights an existing Tegra BSP setting.
CONFIG_WIREGUARD=m

CONFIG_USB_ACM=y

CONFIG_PPS=y
CONFIG_PPS_CLIENT_LDISC=m

CONFIG_CAN=y
CONFIG_CAN_RAW=y
CONFIG_CAN_BCM=y
CONFIG_CAN_GW=m
CONFIG_CAN_VCAN=m
