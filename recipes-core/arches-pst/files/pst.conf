# /pst subdirectory provisioning (Task.md D-04).
#
# A partition is not a mount, and a mount is not a directory tree. Five
# instrumentation units declare ReadWritePaths under /pst with
# ProtectSystem=strict, and systemd refuses to start a unit whose
# ReadWritePaths entry does not exist. Without these lines instr-istate --
# the hub every spoke depends on -- fails at boot.
#
# Ownership follows REQ 6: istate is the sole writer of system/, each spoke
# owns its own state/ subtree, and factory/ is read-only in normal operation.
d /pst                    0755 instr-istate     instr -
d /pst/system             0755 instr-istate     instr -
d /pst/state              0755 instr-istate     instr -
d /pst/state/spool        0700 instr-istate     instr -
d /pst/state/audit        0700 instr-istate     instr -
d /pst/state/alarms       0700 instr-alarms     instr -
d /pst/state/logs         0700 instr-logmanager instr -
d /pst/state/ota          0700 instr-ota        instr -
d /pst/backup             0700 instr-backup     instr -
# factory/ is written only by the factory programming tool. REQ 6 says it is
# "mounted read-only in normal operation" -- that is a mount property, not a
# directory mode, so these are 0755 and the read-only-ness is enforced where
# REQ puts it. Making the directory 0555 does not stop root writing to it, and
# it does break provisioning: tmpfiles cannot create identity/ inside a parent
# it has no write bit on unless it happens to be running as root.
d /pst/factory            0755 root             root  -
d /pst/factory/identity   0755 root             root  -
