BBPATH .= ":${LAYERDIR}"

BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "meta-arches"
BBFILE_PATTERN_meta-arches = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-arches = "10"

LAYERDEPENDS_meta-arches = "core tegra"
LAYERSERIES_COMPAT_meta-arches = "scarthgap"

# webconfigd (recipes-core/webconfig) talks to systemd over D-Bus via polkit
# rules (privileged service start/stop/restart + reboot/poweroff), never as
# root itself. polkit's recipe is gated on REQUIRED_DISTRO_FEATURES = "polkit"
# upstream, so without this the package silently fails to build/parse in.
# A product layer's own layer.conf is the normal place to extend
# DISTRO_FEATURES (same status as local.conf, evaluated at config-parse time).
DISTRO_FEATURES:append = " polkit"
