globals:
{
    verbose      = true;
    loglevel     = 3;
    syslog       = false;
    no-downgrade = false;
    public-key-file = "/etc/swupdate/swupdate-public.pem";
    # Automatically reboot into the new slot after a successful update.
    postupdatecmd = "/sbin/reboot";
};

identify:
{
    name              = "jetson-orin-nano";
    hardware-revision = "1.0";
};

download:
{
    retries = 3;
    timeout = 1800;        /* seconds */
};
